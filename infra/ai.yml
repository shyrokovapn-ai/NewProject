AWSTemplateFormatVersion: "2010-09-09"
Description: Lab 6 - Paste an agenda. Parser Lambda (Claude on Bedrock) + Cognito sign-in + $5 budget alarm

Parameters:
  ProjectName:
    Type: String
    Default: new-project
  ImageUri:
    Type: String
    Description: ECR image of the parser (backend/Dockerfile.agenda)
  ParserModel:
    Type: String
    Default: anthropic.claude-opus-5-5
  AllowedOrigins:
    Type: CommaDelimitedList
    Default: "http://localhost:5173"
    Description: Site origins that may call the parser (CORS)
  AlertEmail:
    Type: String
    Description: Where the budget alarm is sent

Resources:
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "${ProjectName}-users"
      UsernameAttributes: [email]
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: false
      UserPoolTags:
        PROJECT_NAME: !Ref ProjectName

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: !Sub "${ProjectName}-web"
      GenerateSecret: false
      ExplicitAuthFlows: [ALLOW_USER_PASSWORD_AUTH, ALLOW_REFRESH_TOKEN_AUTH]
      PreventUserExistenceErrors: ENABLED

  ParserRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: call-claude-on-bedrock
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: bedrock-mantle:CreateInference
                Resource: "*" # TODO narrow to the model (discussion question)
      Tags:
        - {Key: PROJECT_NAME, Value: !Ref ProjectName}

  ParserLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ProjectName}-agenda-parser"
      RetentionInDays: 14

  ParserFunction:
    Type: AWS::Lambda::Function
    DependsOn: ParserLogs
    Properties:
      FunctionName: !Sub "${ProjectName}-agenda-parser"
      PackageType: Image
      Code:
        ImageUri: !Ref ImageUri
      Role: !GetAtt ParserRole.Arn
      Timeout: 30
      MemorySize: 512
      # no VpcConfig: the parser does not need the database
      Environment:
        Variables:
          PARSER_MODEL: !Ref ParserModel
          BEDROCK_REGION: !Ref AWS::Region
          COGNITO_USER_POOL_ID: !Ref UserPool
          COGNITO_CLIENT_ID: !Ref UserPoolClient
      Tags:
        - {Key: PROJECT_NAME, Value: !Ref ProjectName}

  ParserUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !GetAtt ParserFunction.Arn
      AuthType: NONE # the handler checks the Cognito token itself
      Cors:
        AllowOrigins: !Ref AllowedOrigins
        AllowMethods: [POST]
        AllowHeaders: [authorization, content-type]
        MaxAge: 3600

  UrlInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ParserFunction
      Action: lambda:InvokeFunctionUrl
      Principal: "*"
      FunctionUrlAuthType: NONE

  UrlInvokeFunctionPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ParserFunction
      Action: lambda:InvokeFunction
      Principal: "*"
      InvokedViaFunctionUrl: true

  MonthlyBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: !Sub "${ProjectName}-monthly-5-usd"
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit: {Amount: 5, Unit: USD}
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 80
            ThresholdType: PERCENTAGE
          Subscribers:
            - {SubscriptionType: EMAIL, Address: !Ref AlertEmail}

Outputs:
  ParserUrl:
    Value: !GetAtt ParserUrl.FunctionUrl
  UserPoolId:
    Value: !Ref UserPool
  ClientId:
    Value: !Ref UserPoolClient
